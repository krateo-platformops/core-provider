# core-provider's release pipeline. It started as the canonical component release workflow,
# shared byte-for-byte across component repos; core-provider's copy diverged with the release gate
# (#92, three per-module test jobs) and again with #360 (charts, verification and release notes are
# jobs here, so each one waits for what it depends on).
#
#   tests -> build (3 images) --+
#            release-oci (3 charts) --+--> verify-artifacts --> release-notes (publishes the release)
#
#   • build  — ONE multi-platform image (linux/amd64 + linux/arm64) via the shared reusable
#              workflow, tagged from the pushed git tag. Image = ghcr.io/<owner>/<mod>.
#   • crds   — only acts for CRD-owning repos: runs `make generate` (the single agnostic entry
#              point each CRD repo exposes; repos without it skip cleanly), then opens a PR into
#              the component's chart repo (krateo-platformops/<repo>-chart) refreshing crds-subchart/,
#              and patch-bumping the crds-subchart (CRDs published WITHOUT resource-policy: keep).
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  # Release gate (#92). Before this, a pushed tag went straight to `build` with no `needs:`, so all
  # three images published without the suite ever running against that commit. A tag is the one
  # moment where nothing else stands between a mistake and a published artifact: PR checks prove the
  # branch was green, not that the tagged commit is, and the two differ whenever a tag is cut from
  # anything but a just-merged head — which is exactly when a release goes wrong.
  #
  # Mirrors the three per-module checks from release-pullrequest.yaml. CRD drift stays on
  # core-provider, the only module with committed crds/. The `integration`-tagged tests are
  # deliberately excluded here as they are there: they spin up a real kind cluster and pull from
  # Docker Hub, which is not something to put between a tag and its artifacts.
  test-core-provider:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/core-provider
      fmt_check: true
      tidy_check: true
      crd_drift: true
      test_args: -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  test-composition-dynamic-controller:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/composition-dynamic-controller
      fmt_check: true
      tidy_check: true
      test_args: -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  test-chart-inspector:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/chart-inspector
      fmt_check: true
      tidy_check: true
      test_args: -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  build:
    # The gate itself. Without `needs:` the jobs run CONCURRENTLY and images publish regardless of
    # the result — which is how oasgen-provider shipped past a red suite while appearing to have a
    # test gate (#92). A declared test job is not a gate; `needs:` is.
    needs: [test-core-provider, test-composition-dynamic-controller, test-chart-inspector]
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"core-provider","context":"go/core-provider"},{"mod":"composition-dynamic-controller","context":"go/composition-dynamic-controller"},{"mod":"chart-inspector","context":"go","dockerfile":"go/chart-inspector/Dockerfile"}]'
      # Build stamp (#105). Without these the published images carry main.go's "dev"/"unknown"
      # defaults and an incident can only be traced to a release version, never to a commit. The ARG
      # names must match the three Dockerfiles, which feed them to -ldflags -X main.build{Version,Commit}.
      build_args: |
        VERSION=${{ github.ref_name }}
        COMMIT_HASH=${{ github.sha }}

  # Charts. This used to be its own workflow (release-oci.yaml) triggered by the same tag push, so
  # nothing could wait for it. It is a job here so verify-artifacts can `need` it. release-oci.yaml
  # keeps its workflow_dispatch for republishing a chart by hand.
  release-oci:
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ""
      app_version: ""

  # #360. A GitHub release is a public claim that a version exists, and it used to be published at
  # tag time, about 30 minutes before the images did. Pull every artifact by tag, and require each
  # image's revision label to be THIS commit, before anything is published.
  verify-artifacts:
    needs: [build, release-oci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Pull all six artifacts by tag
        run: .github/scripts/verify-release-artifacts.sh "${{ github.ref_name }}" "${{ github.sha }}"

  # Publishes the release, now only once its artifacts exist. release-notes.yaml keeps its
  # workflow_dispatch for regenerating notes by hand.
  release-notes:
    needs: [verify-artifacts]
    uses: krateo-platformops/.github/.github/workflows/release-notes.yaml@main
    permissions:
      contents: write # the release body and the CHANGELOG commit
      id-token: write # claude-code-action's GitHub App auth; the reusable cannot grant itself this
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
