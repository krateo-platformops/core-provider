name: exercise-interrupted-install

# The automatic recovery of a first install (#629, #636) acts on a release by its own decision. Unit and
# envtest cover the decision, but neither kills a controller mid-hook nor runs under the RBAC
# core-provider generates. This installs core-provider on a disposable kind cluster and kills the real
# controller. Decided by Diego (2026-11-23): exercise it before a cluster runs it.
#
# On a pull request it runs the PR's own core-provider and composition controller, on the published
# charts. By hand (workflow_dispatch) it runs a released version. For one before #636 set control: the arms
# #636 fixed must then FAIL, and that run is green. A red check here is always about the version it names.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released core-provider version to exercise"
        required: true
      control:
        description: "A version before #636, as the control: green only if exactly the arms #636 fixed fail"
        type: boolean
        default: false
  pull_request:
    paths:
      - "go/composition-dynamic-controller/hack/interrupted-install-e2e/**"
      - "go/composition-dynamic-controller/internal/composition/**"
      - "go/composition-dynamic-controller/go.mod"
      - ".github/workflows/exercise-interrupted-install.yaml"

permissions:
  contents: read

jobs:
  exercise:
    name: ${{ inputs.control && 'exercise control (kind)' || 'exercise (kind)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Create the kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # The CLI and the node image go together (integration.yaml says why). The charts need >= 1.36.
          version: v0.33.0
          node_image: kindest/node:v1.36.4
          cluster_name: exercise
      - name: Build and load this commit's images
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA::12}"
          for m in core-provider composition-dynamic-controller; do
            docker build -q -t "ghcr.io/krateo-platformops/$m:$tag" "go/$m"
            kind load docker-image "ghcr.io/krateo-platformops/$m:$tag" --name exercise
          done
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Exercise
        env:
          # The charts' version; on a pull request only chart-inspector runs that version's image.
          VERSION: ${{ inputs.version || '2.13.129' }}
          CONTROL: ${{ inputs.control }}
        run: |
          set -euo pipefail
          helm version --short
          python3 -I go/composition-dynamic-controller/hack/interrupted-install-e2e/run.py \
            --version "$VERSION" --node exercise-control-plane ${IMAGE_TAG:+--image-tag "$IMAGE_TAG"} \
            $([ "$CONTROL" = true ] && echo --control) \
            --chart go/composition-dynamic-controller/hack/interrupted-install-e2e/chart
