name: release-pullrequest

on:
  pull_request:
    # NO `branches:` filter, deliberately.
    #
    # This workflow carries the test matrix, image builds, CRD drift and the e2e job. With `branches: [main]` a PR based on ANOTHER
    # branch — a stacked PR — matched nothing here and ran none of it, while GitHub still
    # rendered a green tick and "All checks have passed". The absence presented as success,
    # so a reviewer doing the right thing got a confirmation meaning the opposite.
    #
    # Measured in oasgen-provider on two PRs carrying identical code and differing only in
    # base: 18 checks against main, 1 against a stack base (krateo-platformops/oasgen-provider#149).
    #
    # Cost: a stacked PR runs the suite twice — once against its stack base, again after
    # GitHub retargets it to main on merge. That is real CI minutes in exchange for a green
    # tick that means the suite actually ran.
    #
    # The `push:` filter below stays: push events are not PRs and main is the only branch
    # whose pushes should trigger a full run.

# core-provider is a Go MONOREPO: three independent modules each with its own go.mod +
# Dockerfile under go/<module>/. The previous inline jobs ran from the repo ROOT and failed on
# every PR ("open Dockerfile: no such file or directory" / "go.mod not found"). This mirrors the
# folded-aware reusables used by release-tag.yaml (and the same shape as the other krateo-* Go
# repos, e.g. authn) so folded and monorepo repos share one CI shape — just one build job per
# module list, and one component-go-checks per module.
jobs:
  build:
    # Validate all three images build multi-platform, WITHOUT pushing. chart-inspector builds from
    # the shared `go` context (its Dockerfile does `COPY . .` then `WORKDIR /src/chart-inspector`),
    # so its dockerfile path is explicit. permissions match authn's build job — the reusable
    # requests packages:write, so the caller must grant it or the run fails at startup.
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"core-provider","context":"go/core-provider"},{"mod":"composition-dynamic-controller","context":"go/composition-dynamic-controller"},{"mod":"chart-inspector","context":"go","dockerfile":"go/chart-inspector/Dockerfile"}]'
      # Same build stamp as release-tag, so the ldflags path is EXERCISED on every PR rather than
      # first running on a tag — a typo in the ARG names or the -ldflags symbol paths would otherwise
      # only surface after a release was cut (#105). head.sha, not github.sha: on a pull_request event
      # the latter is the ephemeral merge commit, which is not a commit anyone can check out.
      build_args: |
        VERSION=pr-${{ github.event.pull_request.number }}
        COMMIT_HASH=${{ github.event.pull_request.head.sha }}
      push: false

  checks-core-provider:
    # CRD-drift (make generate + git diff crds/) runs only here — core-provider is the sole module
    # with committed crds/. Runs the UNIT suite: the `integration`-tagged tests spin up a real kind
    # cluster / pull from Docker Hub (e2e-framework) and are unsuitable for a fast per-PR check —
    # they belong in a dedicated integration workflow. (There are no `unit`-tagged files, so the old
    # `-tags=unit,integration` only added the heavy integration build; dropping it runs all unit tests.)
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/core-provider
      fmt_check: true
      tidy_check: true
      crd_drift: true
      # -count=1 defeats the test cache, which is NOT optional here. Several tests read files
      # OUTSIDE their Go module — internal/tools/policy/chartparity_test.go and
      # internal/tools/deploy/controller_naming_test.go both reach up into helm/core-provider/ —
      # and the build cache does not track those as inputs. Measured: with these exact flags a
      # second run reports `ok (cached)`, so -coverprofile does NOT disable caching as it appears
      # to. setup-go restores the cache across runs, so without -count=1 an edit to a shipped chart
      # template alone can produce a cached pass and those guards are vacuous for precisely the
      # regression they exist to catch.
      test_args: -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  checks-composition-dynamic-controller:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/composition-dynamic-controller
      fmt_check: true
      tidy_check: true
      # -count=1 defeats the test cache, which is NOT optional here. Several tests read files
      # OUTSIDE their Go module — internal/tools/policy/chartparity_test.go and
      # internal/tools/deploy/controller_naming_test.go both reach up into helm/core-provider/ —
      # and the build cache does not track those as inputs. Measured: with these exact flags a
      # second run reports `ok (cached)`, so -coverprofile does NOT disable caching as it appears
      # to. setup-go restores the cache across runs, so without -count=1 an edit to a shipped chart
      # template alone can produce a cached pass and those guards are vacuous for precisely the
      # regression they exist to catch.
      test_args: -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  checks-chart-inspector:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/chart-inspector
      fmt_check: true
      tidy_check: true
      # -count=1 defeats the test cache, which is NOT optional here. Several tests read files
      # OUTSIDE their Go module — internal/tools/policy/chartparity_test.go and
      # internal/tools/deploy/controller_naming_test.go both reach up into helm/core-provider/ —
      # and the build cache does not track those as inputs. Measured: with these exact flags a
      # second run reports `ok (cached)`, so -coverprofile does NOT disable caching as it appears
      # to. setup-go restores the cache across runs, so without -count=1 an edit to a shipped chart
      # template alone can produce a cached pass and those guards are vacuous for precisely the
      # regression they exist to catch.
      test_args: -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...
    secrets: inherit

  tag-compile:
    # Every build tag in this repo COMPILED, even where nothing runs it.
    #
    # The `e2e` job below runs only ./internal/tools/crd/..., and `-tags integration` is run by no
    # job at all. So a tagged test can stop compiling and every check stays green: two in
    # internal/tools/deploy had not built since a signature change to ProjectChartInspector, and
    # nothing noticed (#224).
    #
    # This is the cheap 90% of the value. It needs no cluster and no apiserver — `go vet` type-checks
    # the test binary without running it — and it would have failed the day those broke. It does NOT
    # claim the tests pass; only that they still describe code that exists, which is the claim that
    # was silently false.
    #
    # Same family as the other two found the same day: #220's gate wiring and #221's condition
    # routing were both uncovered, and both defaulted to silent success. A green check asserts two
    # things — that the thing is fine, and that it was examined. Only the first is usually tested.
    name: compile every build tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: go vet, every module, every tag
        run: |
          set -uo pipefail
          rc=0
          n=0
          for m in go/core-provider go/composition-dynamic-controller go/chart-inspector go/testprovider; do
            for tag in default integration e2e envtest; do
              if [ "$tag" = default ]; then args=""; else args="-tags $tag"; fi
              echo "::group::$m ($tag)"
              if ! (cd "$m" && go vet $args ./...); then
                echo "::error::$m does not compile with tag '$tag'"
                rc=1
              fi
              n=$((n+1))
              echo "::endgroup::"
            done
          done
          # A loop that examined nothing would exit 0 and look identical to success — the exact
          # failure mode this job exists to catch, so it must not have it.
          # 16 = 4 modules x 4 tags. go/testprovider joined the list when the #310 verification
          # provider was added; it is built from inside an envtest test, so a compile break there
          # would otherwise first surface as that test failing and point at the wrong file.
          if [ "$n" -ne 16 ]; then
            echo "::error::checked $n module/tag combinations, expected 16 - this job proved nothing"
            exit 1
          fi
          echo "compiled $n module/tag combinations"
          exit $rc

  envtest-cdc:
    # The composition-dynamic-controller's envtest-tagged tests had NO runner. They prove the
    # cache-staleness fix end to end — WatchCRDsAndInvalidate keeping the long-lived
    # DeferredDiscoveryRESTMapper fresh when a CRD is registered mid-run — and they carry their own
    # negative control: an UNWATCHED mapper must stay stale until an explicit Reset().
    #
    # A test with a built-in control that nothing executes is the worst of both worlds: it reads as
    # coverage and gates nothing. This is the same gap as krateo-platformops/plumbing#51 finding 1,
    # in this repo.
    #
    # envtest rather than kind: these need a real kube-apiserver and nothing else — no cluster, no
    # CNI, no operators — so this job is a fraction of the e2e job's cost.
    name: envtest (real apiserver, cdc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      # Pinned to the controller-runtime 0.22 line, matching sigs.k8s.io/controller-runtime v0.22.3
      # in the cdc's go.mod. Do NOT use @latest: newer setup-envtest requires a toolchain this
      # module does not use, and the failure is an unhelpful version error at install time.
      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.22

      # The #310 suite BUILDS go/testprovider from inside the test (a separate module, so that
      # provider-runtime stays out of the cdc's dependency graph). Warm its module cache here:
      # otherwise the first thing that fails on a cold runner is a `go build` inside a test, which
      # reports as a test failure and sends the reader to the wrong file.
      - name: "Pre-build the #310 test provider"
        working-directory: go/testprovider
        run: |
          set -euo pipefail
          go mod download
          go build ./...

      - name: Run the cdc envtest suite
        working-directory: go/composition-dynamic-controller
        run: |
          set -euo pipefail
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.0 -p path)"
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS"

          # -count=1: these read nothing outside the module today, but the suite is cheap and a
          # cached pass here would be indistinguishable from a real one.
          go test -tags envtest -count=1 -timeout 15m -v ./... 2>&1 | tee /tmp/envtest.log

          # The tests SKIP when KUBEBUILDER_ASSETS is unset, so a misconfigured job would go green
          # having executed nothing. Fail on any skip: in this suite a skip means the apiserver
          # assets were not resolved, which is a broken job rather than an inapplicable test.
          if grep -q -- "--- SKIP" /tmp/envtest.log; then
            echo "::error::an envtest test SKIPPED - KUBEBUILDER_ASSETS was not resolved, so this job proved nothing"
            grep -- "--- SKIP" /tmp/envtest.log
            exit 1
          fi

      # THE BRANCH-REMOVAL CONTROL for #310, which is the one control the Go suite cannot contain:
      # a test cannot delete a branch from the code it is running. Without this, every #310 arm
      # could be passing for a reason that has nothing to do with the NotObserved case.
      #
      # Delete the NotObserved term from krateoReady's unevaluated arm, leaving ZeroEvidence, and
      # require the mixed-parent arm to FAIL. That is the pre-#310 behaviour: NotObserved falls to
      # the default and the parent reports Ready=False/Creating.
      #
      # Every step is checked, because each failure mode of this control exits 0 and reads as a
      # pass: an edit that did not apply, a mutant that does not compile, and a test run that
      # errored for an unrelated reason all look identical to "the control worked".
      - name: "Control — removing the #310 branch must break the #310 arm"
        working-directory: go/composition-dynamic-controller
        run: |
          set -euo pipefail
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.36.0 -p path)"
          F=internal/composition/childhealth.go
          cp "$F" /tmp/childhealth.orig.go

          python3 - "$F" <<'EOF'
          import re, sys
          p = sys.argv[1]
          lines = open(p).read().splitlines(keepends=True)

          # Anchor on the NotObserved TERM ALONE, never on the whole case expression.
          #
          # The first version of this control matched both terms as one literal, including
          # `== "ZeroEvidence"`. #312 then replaced that literal with condition.ReasonZeroEvidence
          # on main and the anchor matched 0 times -- so the control REFUSED, correctly, instead of
          # silently proving nothing. An anchor that spans code it does not need to touch inherits
          # every change to that code.
          # THE TERMINATOR IS NOT PART OF THE ANCHOR, and that is this control's second lesson of
          # the same kind. The first version required the term to end in a COLON, i.e. to be the
          # last term of the case. #320 then added ObserveFailed to the same arm, which made
          # NotObserved a middle term ending in a comma -- the anchor matched 0 lines and the
          # control refused, correctly, having proved nothing. #312 had already done this once with
          # the ZeroEvidence literal. Both times the anchor described more of the line than the
          # thing it wanted to delete, and both times the code it had no need to read is what moved.
          pat = re.compile(r'^\s*stringField\(cm, "reason"\) == "NotObserved"\s*([,:])\s*$')
          hits = [(i, m) for i, l in enumerate(lines) for m in [pat.match(l)] if m]
          if len(hits) != 1:
              sys.exit("control NOT APPLIED: the NotObserved term matched %d lines, not 1 -- the "
                       "code moved and this control is measuring nothing" % len(hits))
          i, m = hits[0]
          if i == 0:
              sys.exit("control NOT APPLIED: the NotObserved term is the first line of the file")

          if m.group(1) == ":":
              # LAST term of the case: the colon it carries must move onto the line above, which
              # therefore has to be another term ending in a comma.
              prev = lines[i - 1].rstrip("\n")
              if not prev.endswith(","):
                  sys.exit("control NOT APPLIED: NotObserved is the last term of its case but the "
                           "line above does not end in a comma (%r) -- the case was restructured, "
                           "so deleting one line would not leave valid Go" % prev)
              lines[i - 1] = prev[:-1] + ":\n"
          else:
              # MIDDLE or FIRST term: it ends in a comma and the case keeps its colon on another
              # line, so deleting this line alone leaves valid Go. Checked rather than assumed,
              # because "the mutant does not compile" is one of the failure modes that exits 0 and
              # reads as a pass.
              nxt = lines[i + 1].strip() if i + 1 < len(lines) else ""
              if not nxt.startswith('stringField(cm, "reason")'):
                  sys.exit("control NOT APPLIED: NotObserved ends in a comma but the line after it "
                           "(%r) is not another term of the same case -- deleting one line would "
                           "not leave valid Go" % nxt)
          del lines[i]
          open(p, "w").writelines(lines)
          print("control applied: removed the NotObserved term from the unevaluated arm")
          EOF

          # A real diff, or the control proved nothing.
          if diff -q "$F" /tmp/childhealth.orig.go >/dev/null; then
            echo "::error::the control edit left the file unchanged"
            cp /tmp/childhealth.orig.go "$F"; exit 1
          fi

          # A mutant that does not compile also makes the test "fail", for the wrong reason.
          if ! go build ./... ; then
            echo "::error::the control edit does not compile, so a test failure would prove nothing"
            cp /tmp/childhealth.orig.go "$F"; exit 1
          fi

          set +e
          go test -tags envtest -count=1 -timeout 15m \
            -run 'NotObservedEnvtest_(OneNotObservedSiblingHealthyStaysTrue|AllHealthyIsAvailable)' \
            ./internal/composition/ > /tmp/control.log 2>&1
          rc=$?
          set -e
          cp /tmp/childhealth.orig.go "$F"
          diff -q "$F" /tmp/childhealth.orig.go >/dev/null || { echo "::error::failed to restore $F"; exit 1; }

          # The POSITIVE control inside the control: AllHealthyIsAvailable must still pass with the
          # branch removed, since it has no NotObserved child. If BOTH arms fail, the mutant broke
          # something general and this tells us nothing about the #310 arm specifically.
          if grep -q -- "--- FAIL: TestNotObservedEnvtest_AllHealthyIsAvailable" /tmp/control.log; then
            echo "::error::with the #310 branch removed the all-healthy arm ALSO failed - the edit broke something general, so this control is uninterpretable"
            cat /tmp/control.log; exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::removing the #310 NotObserved branch did NOT fail the #310 arm - the arm is not testing that branch"
            cat /tmp/control.log; exit 1
          fi
          if ! grep -q -- "--- FAIL: TestNotObservedEnvtest_OneNotObservedSiblingHealthyStaysTrue" /tmp/control.log; then
            echo "::error::the run failed but NOT at the #310 arm - the failure is unrelated, so the control proved nothing"
            cat /tmp/control.log; exit 1
          fi
          echo "control OK: the #310 arm fails when and only when its branch is removed"
          grep -- "--- \(FAIL\|PASS\)" /tmp/control.log

  e2e:
    # The e2e suite (internal/tools/crd/*_e2e_test.go, `//go:build e2e`) needs a REAL apiserver and
    # was therefore behind a build tag that nothing passed. It proves things the unit tests cannot:
    # that a generated CRD round-trips losslessly through the None+vacuum storage version, that the
    # composition-version MutatingAdmissionPolicy stamps in-apiserver with no webhook, and that
    # nested defaults materialize under an omitted parent.
    #
    # Unrun, it rotted: TestE2E_NestedDefault235 asserted a fix that had never been implemented and
    # had been failing silently for weeks (#138). A test suite with no gate behind it is not a
    # safety net, it is a claim — this is the same shape as #92, where the release path published
    # images regardless of test results.
    #
    # Needs k8s >= 1.36 for the GA MutatingAdmissionPolicy API. Note kindest/node has no v1.36.0
    # image published; v1.36.4 is the usable 1.36 tag.
    name: e2e (real apiserver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Create kind cluster (k8s 1.36)
        uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.36.4
          cluster_name: core-provider-e2e
      # Fail loudly if the cluster cannot actually exercise what the suite is for. The policy test
      # calls t.Skipf when MutatingAdmissionPolicy is unavailable, so without this a wrong node
      # image would produce a GREEN job that silently proved nothing — which is precisely the
      # failure this whole issue is about.
      - name: Verify the cluster can exercise the suite
        run: |
          set -euo pipefail
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          kubectl version -o json | jq -r '"server: " + .serverVersion.gitVersion'
          # POLL, do not single-shot. Discovery is not populated the instant kind reports ready, so
          # one `api-resources` call conflates "not served by this apiserver" with "not listed yet"
          # — opposite findings, and the second one is transient. Read as the former it failed 4 of
          # the last 12 runs on unrelated branches, including a DOCS-ONLY one that cannot affect
          # which APIs the apiserver serves, each passing on a plain re-run.
          #
          # The check itself stays strict: the suite's policy test calls t.Skipf when
          # MutatingAdmissionPolicy is unavailable, so a wrong node image must still fail this job
          # rather than produce a green run that proved nothing. Only the verdict is deferred until
          # discovery has had a fair chance to answer.
          deadline=$((SECONDS + 120))
          until kubectl api-resources --api-group=admissionregistration.k8s.io 2>/dev/null \
                  | grep -q mutatingadmissionpolicies; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::MutatingAdmissionPolicy (GA) still absent from admissionregistration.k8s.io after 120s - the policy e2e test would SKIP, not pass"
              kubectl api-resources --api-group=admissionregistration.k8s.io || true
              exit 1
            fi
            echo "waiting for admissionregistration.k8s.io discovery to list mutatingadmissionpolicies..."
            sleep 5
          done
          echo "MutatingAdmissionPolicy is served; the policy e2e test will run rather than skip"

      - name: Run e2e suite
        working-directory: go/core-provider
        run: |
          set -euo pipefail
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          go test -tags=e2e -timeout 20m -v ./internal/tools/crd/... 2>&1 | tee /tmp/e2e.log
          # A skipped test is not a passing test. If the suite skipped anything, say so and fail:
          # the entire point of this job is that these assertions actually run.
          if grep -q -- '--- SKIP' /tmp/e2e.log; then
            echo "::error::e2e tests were SKIPPED - this job exists to run them, not to report green"
            grep -- '--- SKIP' /tmp/e2e.log
            exit 1
          fi

  lint-docs:
    # THE canonical documentation-conformance check (the Krateo Documentation Standard):
    # invariant core file set, OKF frontmatter, resolvable links, dead-org ban.
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
