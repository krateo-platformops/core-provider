name: exercise-resource-policy

# Does helm.sh/resource-policy: keep hold on the composition controller's own path? installer and
# agentgateway gate a roll on the answer (agentgateway-policies#122), and helm's CLI is not that path.
# Installs the RELEASED charts on a disposable kind cluster; see hack/resource-policy-e2e/run.py.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released core-provider version to exercise"
        required: true
  pull_request:
    paths:
      - "go/composition-dynamic-controller/hack/resource-policy-e2e/**"
      - ".github/workflows/exercise-resource-policy.yaml"

permissions:
  contents: read

jobs:
  exercise:
    name: resource-policy (kind, released charts)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Create the kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          # The CLI and the node image go together (integration.yaml says why). The charts need >= 1.36.
          version: v0.33.0
          node_image: kindest/node:v1.36.4
          cluster_name: exercise
      - name: Exercise
        env:
          VERSION: ${{ inputs.version || '2.13.128' }}
        run: |
          set -euo pipefail
          python3 -I go/composition-dynamic-controller/hack/resource-policy-e2e/run.py --version "$VERSION"
