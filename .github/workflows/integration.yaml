name: integration

# `-tags integration` was run by no job: tag-compile only proved these tests still build, so a test
# could assert anything and every check stayed green (#372's condition was documented everywhere and
# set by no code, and its test first looked covered by 28 green checks). A test nothing runs is a
# claim. Separate from release-pullrequest because each package starts its own kind cluster, which is
# too slow for that workflow's fast checks.
on:
  pull_request:
    paths:
      - "go/core-provider/**"
      - "helm/core-provider/**"
      # The suite runs the cdc built from the commit (#404), so a cdc change is under test too.
      - "go/composition-dynamic-controller/**"
      - ".github/workflows/integration.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    name: integration (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          # The CLI must be the kind release that PUBLISHES the node image below (kindest/node:v1.36.4
          # is in kind v0.33.0's release notes). The action's default (v0.31.0 in #404's run 7)
          # creates the cluster but cannot `kind load` into it: "unknown containerd config version: 4
          # (supported versions: 2 and 3)". Loading the commit's cdc image (#404) is the first step
          # that needs a matching CLI. Bump both together.
          version: v0.33.0
      # The suite deploys composition controllers from the CHART's templates with THIS commit's cdc
      # (#404). It used to run a fixture pinned to composition-dynamic-controller:2.13.31 that had
      # drifted from the chart, and no test needed that controller to work until #313's incident test.
      - name: Build the cdc from this commit
        run: docker build -t "composition-dynamic-controller:ci-${GITHUB_SHA::12}" go/composition-dynamic-controller
      - name: Run the integration suite
        working-directory: go/core-provider
        env:
          # kindest/node has no v1.36.0 image; v1.36.4 is the usable 1.36 tag.
          KIND_NODE_IMAGE: kindest/node:v1.36.4
        run: |
          set -uo pipefail
          export CDC_IMAGE="composition-dynamic-controller:ci-${GITHUB_SHA::12}"
          # -p 1: every package starts a cluster, and a runner cannot hold them all at once.
          go test -tags=integration -count=1 -p 1 -timeout 55m -v ./... 2>&1 | tee /tmp/integration.log
          rc=${PIPESTATUS[0]}
          # A skipped test is not a passing test, and a test nothing reached is not a test at all.
          # The one exception skips on purpose, to record that its call site is unreachable without
          # a local chart fixture, and it is named so that any new skip still fails here.
          if grep -- '--- SKIP' /tmp/integration.log | grep -v 'TestObserve_AvailableRequiresAnEstablishedCRD'; then
            echo "::error::integration tests were SKIPPED - this job exists to run them"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestController/Setup/Test_ApiRef_RBAC_condition' /tmp/integration.log; then
            echo "::error::the ApiRef RBAC assessment did not pass, or never ran"
            rc=1
          fi
          exit "$rc"
