apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .resource }}-{{ .apiVersion }}-controller
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ .resource }}-{{ .apiVersion }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: krateoplatformops
    app.kubernetes.io/managed-by: krateo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      name: {{ .name }}
      namespace: {{ .namespace }}
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      serviceAccountName: {{ .resource }}-{{ .apiVersion }}
      securityContext:
        {}
      containers:
        - name: {{ .resource }}-{{ .apiVersion }}-controller
          image: "ghcr.io/krateo-platformops/composition-dynamic-controller:2.13.31"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: {{ .resource }}-{{ .apiVersion }}-configmap
          securityContext:
            {}
          args:
            - -debug
            - -group={{ .apiGroup }}
            - -version={{ .apiVersion }}
            - -resource={{ .resource }}
            - -namespace={{ .namespace }}
            {{- if .workers }}
            - -workers={{ .workers }}
            {{- end }}
            {{- if .resyncInterval }}
            - -resync-interval={{ .resyncInterval }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            null
          readinessProbe:
            null
          resources: {{ if .resources }}{{ .resources }}{{ else }}{}{{ end }}