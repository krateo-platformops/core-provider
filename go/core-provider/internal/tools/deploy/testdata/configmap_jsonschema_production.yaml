apiVersion: v1
kind: ConfigMap
metadata:
  # The name helm/core-provider/assets/jsonSchemaConfigmap.yaml renders in production (that file is
  # helm-escaped, so it cannot be read here directly): <resource>-<apiVersion>-jsonschema-configmap,
  # the same name getJsonSchemaConfigmapNN derives, which the legacy removal relies on.
  name: {{ .resource }}-{{ .apiVersion }}-jsonschema-configmap
  namespace: {{ .namespace }}
data:
  "values.schema.json" : |-
{{ .schema | indent 4 }}
