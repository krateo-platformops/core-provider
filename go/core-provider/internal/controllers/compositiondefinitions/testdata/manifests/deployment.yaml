apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .resource }}-{{ .apiVersion }}-controller
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ .resource }}-{{ .apiVersion }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: krateoplatformops
    app.kubernetes.io/managed-by: krateo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      name: {{ .name }}
      namespace: {{ .namespace }}
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      serviceAccountName: {{ .serviceAccountName}}
      securityContext:
        {}
      containers:
        - name: {{ .resource }}-{{ .apiVersion }}-controller
          image: "ghcr.io/krateo-platformops/composition-dynamic-controller:2.13.31"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ .resource }}-{{ .apiVersion }}-configmap
          # Mirrors what the chart emits for the default cdc.goMemLimit: "request" (#202).
          # NOTE: this fixture has drifted from helm/core-provider/assets/cdc/deployment.yaml in
          # other respects (it still names the dead "krateoplatformops" org, and predates the
          # trunc-63 labels and terminationGracePeriodSeconds). Only this block is known current.
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: {{ .resource }}-{{ .apiVersion }}-controller
                  resource: requests.memory
                  divisor: "1"
          securityContext:
            {}
          args:
            - -debug
            - -group={{ .apiGroup }}
            - -version={{ .apiVersion }}
            - -resource={{ .resource }}
            - -namespace={{ .namespace }}
            {{- if .workers }}
            - -workers={{ .workers }}
            {{- end }}
            {{- if .resyncInterval }}
            - -resync-interval={{ .resyncInterval }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            null
          readinessProbe:
            null
          resources: {{ if .resources }}{{ .resources }}{{ else }}{}{{ end }}
          volumeMounts:
          {{- if .api_ref_name }}
            - name: authn-serviceaccount-token
              mountPath: /var/run/secrets/krateo.io/serviceaccount
              readOnly: true
          {{- end }}
      volumes:
      {{- if .api_ref_name }}
        - name: authn-serviceaccount-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: authn
                  expirationSeconds: 3600
      {{- end }}