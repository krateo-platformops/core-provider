apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .resource }}-{{ .apiVersion }}-lease
  namespace: {{ .namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .resource }}-{{ .apiVersion }}-lease
subjects:
- kind: ServiceAccount
  name: {{ .serviceAccount }}
  namespace: {{ .saNamespace }}
