---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kubernetestargets.core.krateo.io
spec:
  group: core.krateo.io
  names:
    categories:
    - krateo
    - core
    kind: KubernetesTarget
    listKind: KubernetesTargetList
    plural: kubernetestargets
    singular: kubernetestarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.connectionStatus
      name: CONNECTION
      type: string
    - jsonPath: .status.version
      name: VERSION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KubernetesTarget is a namespaced reference to a remote cluster, used by a
          CompositionDefinition's spec.deploy.targetRef (resolved in the CompositionDefinition's
          own namespace) to deploy compositions remotely. It is namespaced so per-namespace
          writes through snowplow /call (which force-namespaces every write) can create it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubernetesTargetSpec describes how to reach a remote target
              cluster.
            properties:
              kubeconfigRef:
                description: |-
                  KubeconfigRef: reference to a Kubernetes Secret key holding the kubeconfig of the
                  target cluster. The Secret is the credential rotation seam - populate and rotate
                  it via External Secrets Operator.
                properties:
                  key:
                    description: The key to select.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                  namespace:
                    description: Namespace of the referenced object.
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
            required:
            - kubeconfigRef
            type: object
          status:
            description: |-
              KubernetesTargetStatus reports the observed reachability of the target cluster, refreshed by the
              KubernetesTarget reachability reconciler. It turns the passive reference into a registered spoke
              with lifecycle: a Ready condition, the reported Kubernetes version, and the credential the last
              probe used (for rotation traceability).
            properties:
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionStatus:
                description: ConnectionStatus is Healthy when the target cluster's
                  API is reachable, Down otherwise.
                type: string
              kubeconfigSecretResourceVersion:
                description: |-
                  KubeconfigSecretResourceVersion is the resourceVersion of the kubeconfig Secret used by the
                  last successful probe, for rotation traceability.
                type: string
              lastProbeTime:
                description: LastProbeTime is when the target's reachability was last
                  checked.
                format: date-time
                type: string
              version:
                description: Version is the Kubernetes version reported by the target
                  cluster on the last successful probe.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
