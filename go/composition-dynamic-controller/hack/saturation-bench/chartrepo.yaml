# Serves the packaged chart over HTTP, from a ConfigMap run.sh creates from `helm package`.
apiVersion: v1
kind: Namespace
metadata: {name: chartrepo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: chartrepo, namespace: chartrepo}
spec:
  replicas: 1
  selector: {matchLabels: {app: chartrepo}}
  template:
    metadata: {labels: {app: chartrepo}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        # Unprivileged build: listens on 8080 as uid 101, so no privileged port and no root.
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports: [{containerPort: 8080}]
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        volumeMounts:
        - {name: charts, mountPath: /usr/share/nginx/html, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: charts
        configMap: {name: satchart}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: chartrepo, namespace: chartrepo}
spec:
  selector: {app: chartrepo}
  ports: [{port: 80, targetPort: 8080}]
