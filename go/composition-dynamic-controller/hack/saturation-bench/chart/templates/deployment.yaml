apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pause
  labels:
    app.kubernetes.io/part-of: satchart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-pause
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-pause
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
