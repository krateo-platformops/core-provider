apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pause
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: satchart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-pause
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-pause
    spec:
      terminationGracePeriodSeconds: 0
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: gcr.io/google_containers/pause:3.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
