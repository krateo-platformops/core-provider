# Receives the cdc's OTLP metrics and re-exposes them as Prometheus text, which run.sh reads through the
# API server's service proxy (no port-forward and no exec: the cdc image is distroless).
apiVersion: v1
kind: Namespace
metadata: {name: otel}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-config, namespace: otel}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 10m
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel, namespace: otel}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel}}
  template:
    metadata: {labels: {app: otel}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: collector
        image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.120.0
        args: ["--config=/etc/otel/config.yaml"]
        ports:
        - {containerPort: 4318}
        - {containerPort: 8889}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 1, memory: 512Mi}
        volumeMounts: [{name: config, mountPath: /etc/otel, readOnly: true}]
      volumes:
      - name: config
        configMap: {name: otel-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel, namespace: otel}
spec:
  selector: {app: otel}
  ports:
  - {name: otlp, port: 4318, targetPort: 4318}
  - {name: prom, port: 8889, targetPort: 8889}
