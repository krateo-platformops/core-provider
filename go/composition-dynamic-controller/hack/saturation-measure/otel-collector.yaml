# Receives the cdc OTLP metrics and re-exposes them for run.py, read through the API server proxy.
apiVersion: v1
kind: Namespace
metadata: {name: otel}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-config, namespace: otel}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 2s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 10m
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel, namespace: otel}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel}}
  template:
    metadata: {labels: {app: otel}}
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.120.0
        args: ["--config=/etc/otel/config.yaml"]
        ports:
        - {containerPort: 4318}
        - {containerPort: 8889}
        volumeMounts: [{name: config, mountPath: /etc/otel}]
      volumes:
      - name: config
        configMap: {name: otel-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel, namespace: otel}
spec:
  selector: {app: otel}
  ports:
  - {name: otlp, port: 4318, targetPort: 4318}
  - {name: prom, port: 8889, targetPort: 8889}
