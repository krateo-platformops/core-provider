apiVersion: apps/v1
kind: Deployment
metadata: {name: chartrepo, namespace: chartrepo}
spec:
  replicas: 1
  selector: {matchLabels: {app: chartrepo}}
  template:
    metadata: {labels: {app: chartrepo}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        volumeMounts: [{name: charts, mountPath: /usr/share/nginx/html}]
      volumes:
      - name: charts
        configMap: {name: loadchart}
---
apiVersion: v1
kind: Service
metadata: {name: chartrepo, namespace: chartrepo}
spec:
  selector: {app: chartrepo}
  ports: [{port: 80, targetPort: 80}]
