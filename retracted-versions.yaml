# Published versions that must not be pinned.
#
# A tag cannot be withdrawn: it stays in the registry and looks like any other release. This list is
# how a release is marked bad where a pinning session will see it. installer's CI reads it (from this
# repo's root, see installer's .github/retraction-sources.yaml) and refuses a pin on a listed version,
# so nothing depends on anyone having been told.
#
# An entry is a claim this repo makes about its OWN release, so its reason must say what was measured
# and what was inferred. A version that is merely SUPERSEDED by a better one (no worse than what it
# replaces) does not belong here: listing it would claim it is worse than its neighbours.
#
# `charts` names charts this repo publishes (go/core-provider/retracted_versions_test.go enforces the
# set from .github/scripts/verify-release-artifacts.sh). `use` is the version to pin instead.
retracted:
  # A range is written as the explicit list of its versions, not as bounds: installer's
  # check-retracted-versions.py accepts `version:` or a non-empty `versions:` list, never both.
  - versions: [2.13.85, 2.13.86, 2.13.87, 2.13.88, 2.13.89, 2.13.90, 2.13.91, 2.13.92, 2.13.93, 2.13.94]
    charts: [core-provider]
    use: 2.13.95
    reason: >-
      core-provider#484: adding a served version to a CompositionDefinition's CRD kept every vacated
      version through its grace period, so the CRD could carry a third large schema version.
      MEASURED (envtest, real etcd): a CRD with a third ~560 KB-schema version is refused with
      "etcdserver: request is too large". INFERRED from the code, not reproduced end to end on a
      cluster: on a definition whose versions each carry roughly 500 KB or more of schema, the
      controller then wedges retrying that write. Only the core-provider chart (the controller) is
      affected; core-provider-crds at the same versions is not. Fixed in 2.13.95 (#489); any later
      release also has the fix.
  - version: 2.13.125
    charts: [core-provider, core-provider-crds, core-provider-target]
    use: 2.13.126
    reason: >-
      Never published. MEASURED: the 2.13.125 release-tag run failed at startup (run 45080459712,
      startup_failure), because the shared krateo-platformops/.github release-oci.yaml had made
      index_channel a required input (77bcf7f) that this repo did not pass; no image or chart exists
      for the tag (installer checked core-provider 2.13.125 absent, 2.13.117 present as control).
      Listed although nothing is pullable: charts could still be published for the existing tag
      later by dispatching release-oci, and Diego decided (2026-11-23) to skip it. 2.13.126 carries
      the same changes plus the workflow fix (#624).
