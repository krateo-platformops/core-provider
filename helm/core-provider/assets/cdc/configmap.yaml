apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ "{{" }} .resource {{ "}}" }}-{{ "{{" }} .apiVersion {{ "}}" }}-configmap
  namespace: {{ "{{" }} .namespace {{ "}}" }}
  labels:
    app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
    app.kubernetes.io/instance: {{ "{{" }} trunc 63 .resource {{ "}}" }}
    app.kubernetes.io/version: {{ "{{" }} trunc 63 .apiVersion {{ "}}" }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: krateo
    app.kubernetes.io/managed-by: krateo
data:
  COMPOSITION_CONTROLLER_SA_NAME: {{ "{{" }} .composition_controller_sa_name {{ "}}" }}
  COMPOSITION_CONTROLLER_SA_NAMESPACE: {{ "{{" }} .composition_controller_sa_namespace {{ "}}" }}
  COMPOSITION_CONTROLLER_STATUS_DATA_TEMPLATE: {{ "{{" }} .status_data_template | quote {{ "}}" }}
  COMPOSITION_CONTROLLER_API_REF_NAME: {{ "{{" }} .api_ref_name | quote {{ "}}" }}
  COMPOSITION_CONTROLLER_API_REF_NAMESPACE: {{ "{{" }} .api_ref_namespace | quote {{ "}}" }}
  COMPOSITION_CONTROLLER_API_REF_EXTRAS: {{ "{{" }} .api_ref_extras | quote {{ "}}" }}
  {{- include "core-provider.cdcProcessEnvHead" . | nindent 2 }}
  # #251 item 4: the authn this controller exchanges its projected token with, resolved by
  # core-provider for where the controller runs: a remote target's KubernetesTarget.spec.authnUrl, or
  # core-provider's own authn URL (apiRefRBAC.authnUrl) for a local one; otherwise the in-cluster
  # authn Service in COMPOSITION_AUTHN_NAMESPACE. Never empty (an empty value would override the
  # controller's default with "").
  URL_AUTHN: {{ "{{" }} .authn_url | quote {{ "}}" }}
  DEPLOYMENT_NAME: {{ "{{" }} .resource {{ "}}" }}-{{ "{{" }} .apiVersion {{ "}}" }}-controller
  # docs/design/cdc-pooling.md, step 2: the Lease this controller must hold to reconcile its Kind at
  # this version, in its own namespace (POD_NAMESPACE). Named for the Kind x version, so any other
  # controller for it (the next pod of a rolling update, a pool) waits for the same Lease. Granted by
  # assets/cdc/rbac/lease-role.yaml from the same value.
  COMPOSITION_CONTROLLER_LEASE_NAME: {{ "{{" }} .controllerLease {{ "}}" }}
  {{ "{{" }}- if .pool {{ "}}" }}
  # docs/design/cdc-pooling.md §5c: a POOL member is configured only from this ConfigMap (the pool's
  # process has no per-Kind arguments), so it carries what a dedicated controller takes as arguments:
  # its Kind x version, and its own workers/resync only when the definition sets them. Rendered only
  # for a pool member, so a dedicated controller's ConfigMap (and its checksum, in the pod template)
  # is unchanged. The member keys are not COMPOSITION_CONTROLLER_WORKERS/_RESYNC_INTERVAL: cdc.env
  # below may set those as a fleet default, which must not read as this member's own.
  COMPOSITION_CONTROLLER_GROUP: {{ "{{" }} .apiGroup | quote {{ "}}" }}
  COMPOSITION_CONTROLLER_VERSION: {{ "{{" }} .apiVersion | quote {{ "}}" }}
  COMPOSITION_CONTROLLER_RESOURCE: {{ "{{" }} .resource | quote {{ "}}" }}
  {{ "{{" }}- if .workers {{ "}}" }}
  KRATEO_POOL_MEMBER_WORKERS: {{ "{{" }} .workers | quote {{ "}}" }}
  {{ "{{" }}- end {{ "}}" }}
  {{ "{{" }}- if .resyncInterval {{ "}}" }}
  KRATEO_POOL_MEMBER_RESYNC_INTERVAL: {{ "{{" }} .resyncInterval | quote {{ "}}" }}
  {{ "{{" }}- end {{ "}}" }}
  {{ "{{" }}- end {{ "}}" }}
  {{- include "core-provider.cdcProcessEnvTail" . | nindent 2 }}