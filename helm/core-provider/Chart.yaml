apiVersion: v2
name: core-provider
description: Krateo PlatformOps Core Provider

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Kubernetes >= 1.36 is a hard requirement, not a recommendation. This chart ships
# templates/compositions-version-policy.yaml, a MutatingAdmissionPolicy on
# admissionregistration.k8s.io/v1 -- the GA shape, which does not exist before 1.36. That policy
# stamps the krateo.io/composition-version label, and the composition-dynamic-controller watches
# by it (see compositiondefinitions.go: "must exist in every cluster a composition CRD lives in").
#
# Without this floor a 1.35 cluster installs the chart happily and fails at RUNTIME, in the worst
# available shape: compositions are admitted unlabelled, no CDC watch matches them, and the
# install looks healthy while reconciling nothing. An install-time refusal is strictly better
# than a silent no-op, which is the whole reason this line exists.
#
# 1.36 also subsumes the 1.33 CRD-validation-ratcheting floor: several paths here write
# CompositionDefinition with a full-object Update (compositiondefinitions.go:289,
# compositionmirror.go:141/150/298), which re-validates the whole object. Do not "simplify" this
# to 1.33 on ratcheting grounds -- the binding constraint is the policy, and it is higher.
kubeVersion: ">=1.36.0-0"


# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: CHART_VERSION

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: APP_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - core-provider
  - composition
  - blueprint
sources:
  - https://github.com/krateo-platformops/core-provider/tree/APP_VERSION
annotations:
  krateo.io/category: application
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"
