apiVersion: v2
name: core-provider
description: Krateo PlatformOps Core Provider

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Minimum Kubernetes version. NOT a routine compatibility bound -- it is a correctness requirement,
# and two independent ones. 1.36 is the higher of the two, not a rounding.
#
# (1) MutatingAdmissionPolicy, GA on admissionregistration.k8s.io/v1 from 1.36. This chart ships it
# as templates/compositions-version-policy.yaml, and it is what stamps krateo.io/composition-version
# at admission. The composition-dynamic-controller builds an EXACT-equality requirement on that
# label -- labels.NewRequirement(CompositionVersionLabel, selection.Equals, ...) at
# composition-dynamic-controller/main.go:329 -- and hands it to the ListWatcher (main.go:376). So an
# unlabelled composition is never delivered to the controller at all.
#
# Note the three-tier resolution in archive/getter.go does NOT rescue this, though it reads as
# though it might: tier 3 ("a single definition serving this kind") tolerates version SKEW, and it
# runs downstream of the watch filter. An instance the ListWatcher never yields is never resolved by
# anything.
#
# (2) CRD validation ratcheting, GA at 1.33. Several paths write CompositionDefinition with a
# full-object Update (compositiondefinitions.go:289, compositionmirror.go:141/150/298), which
# re-validates the whole object. Still a real requirement; it is simply no longer the binding one.
# Do not "simplify" the floor to 1.33 on ratcheting grounds -- the policy is binding and higher.
#
# This floor DOES exclude supported clusters, deliberately. 1.33, 1.34 and 1.35 are all current
# upstream and can no longer install this chart. Those versions do not serve
# MutatingAdmissionPolicy, so nothing writes krateo.io/composition-version, the controller's exact
# selector matches nothing, and the install comes up green while reconciling no composition at all.
# A refused install is the better failure, and that is the entire reason this line exists.
kubeVersion: ">=1.36.0-0"


# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: CHART_VERSION

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: APP_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - core-provider
  - composition
  - blueprint
sources:
  - https://github.com/krateo-platformops/core-provider/tree/APP_VERSION
annotations:
  krateo.io/category: application
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"
