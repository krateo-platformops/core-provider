apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-inspector.fullname" . }}
  labels:
    {{- include "chart-inspector.labels" . | nindent 4 }}
spec:
  {{- if not .Values.chartInspector.autoscaling.enabled }}
  replicas: {{ .Values.chartInspector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart-inspector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ printf "%s" (include (print $.Template.BasePath "/chart-inspector/configmap.yaml") .) | sha256sum }}
        {{- with .Values.chartInspector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart-inspector.labels" . | nindent 8 }}
        {{- with .Values.chartInspector.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.chartInspector.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart-inspector.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.chartInspector.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "chart-inspector.fullname" . }}
          image: {{ include "krateo.image" (dict "img" .Values.chartInspector.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.chartInspector.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "chart-inspector.fullname" . }}
          securityContext:
            {{- toYaml .Values.chartInspector.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.chartInspector.service.port }}
              protocol: TCP
          {{- with .Values.chartInspector.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.chartInspector.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.chartInspector.resources | nindent 12 }}
          {{- if .Values.chartInspector.preStopSleepSeconds }}
          # preStop sleep closes the terminating-pod dataplane race (#148).
          #
          # Endpoint withdrawal is asynchronous: when a pod starts terminating, kube-proxy/the
          # dataplane may still route a new connection to it for a short window. A caller that dials
          # the ClusterIP in that window sends a SYN to a pod no longer accepting, and the connection
          # hangs until the DIALER times out — 30s, from http.DefaultTransport, not the client's
          # deliberate 300s request timeout. The CDC has no in-reconcile retry, so that reconcile
          # fails and the composition reports Ready=False until the next pass.
          #
          # Sleeping here keeps the container serving while its endpoint is withdrawn, so in-flight
          # and newly-routed requests complete normally. The pod is already out of the Service by the
          # time it exits.
          #
          # Observed on krateo-057 during an engine roll: Portal/portal went Ready=False on exactly
          # this dial timeout and self-healed 2m09s later. With 67 composition CRs depending on this
          # one endpoint for RBAC generation, every restart manufactures unhealthy-looking
          # compositions that have nothing wrong with them — which is the noise that hides a real one.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.chartInspector.preStopSleepSeconds }}"]
          {{- end }}

          volumeMounts:
            {{- with .Values.chartInspector.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
          {{- with .Values.chartInspector.volumes }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
      {{- with .Values.chartInspector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chartInspector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- with .Values.chartInspector.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        # Default SOFT spread: when scaled to >=2 replicas (HA opt-in), prefer different nodes for
        # real node-failure HA. ScheduleAnyway keeps the single-replica default and dev clusters schedulable.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chart-inspector.selectorLabels" . | nindent 14 }}
        {{- end }}
      {{- with .Values.chartInspector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
