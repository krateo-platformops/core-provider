{{/*
Stamps each composition instance with the served version it was written through
(label krateo.io/composition-version), consumed by core-provider for per-version
listing/migration. In-apiserver (CEL) replacement for the former /mutate admission
webhook - no webhook server, serving cert, or MutatingWebhookConfiguration.

Requires the GA MutatingAdmissionPolicy API (admissionregistration.k8s.io/v1),
available from Kubernetes 1.36. NOTE: for remote deployment targets the same policy
must also exist in each target cluster (compositions are created there).

The name is the FIXED cluster-wide singleton "krateo-composition-version" — NOT
release-prefixed — so it matches the name core-provider's binary projects into remote
targets (policy.PolicyName) and the target-chart. A single source of truth; one policy
per cluster. (On upgrade from a release-prefixed name, helm replaces the old object.)

What the label MEANS: operations covers CREATE and UPDATE, so the value is rewritten on
every write. It records the served version an instance was LAST WRITTEN THROUGH — not the
version it was created at, and not an origin that code may compare against (that is
core-provider#168, which needs a separate CREATE-only sibling policy writing a different
key). The UPDATE half is load-bearing and must not be dropped: every cdc ListWatcher
filters on EXACT equality of this label, so an instance that stopped being re-stamped
would never be delivered to any controller and would wedge on its finalizer.
Full note: go/core-provider/internal/tools/policy/policy.go (versionLabel).
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: krateo-composition-version
spec:
  matchConstraints:
    matchPolicy: Exact
    resourceRules:
    - apiGroups: ["composition.krateo.io"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE"]
      resources: ["*"]
  failurePolicy: Fail
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{ metadata: Object.metadata{ labels: {"krateo.io/composition-version": request.requestKind.version} } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: krateo-composition-version
spec:
  policyName: krateo-composition-version
