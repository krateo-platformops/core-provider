apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "core-provider.fullname" . }}-{{ .Release.Namespace }}
rules:
- apiGroups:
  - core.krateo.io
  resources:
  - compositiondefinitions
  - compositiondefinitions/status
  - schemadefinitions
  - schemadefinitions/status
  - kubernetestargets
  # /status is a SEPARATE grant: the KubernetesTarget reachability reconciler writes it, and the
  # RemoteInstall controller manages remoteinstalls (+ status) — one declarative install-on-spoke.
  - kubernetestargets/status
  - remoteinstalls
  - remoteinstalls/status
  verbs:
  - '*'
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  # The /status subresource is a SEPARATE RBAC grant ('*' on the parent does not cover it). Needed so
  # the served-version prune (#103) can trim status.storedVersions before removing a version from
  # spec.versions (the apiserver forbids dropping a still-stored version otherwise).
  - customresourcedefinitions/status
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
# core-provider#423 (AUDIT-4): an audit record's krateo.audit.preview is the target Namespace's
# krateo.io/purpose label, read by the writer from apiserver state (audit schema). Read-only, get
# only: no list, no watch, no write. Without it the record is still written, marked preview-unknown.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# #393. provider-runtime's scaletozero helper reads and patches a composition controller's SCALE
# subresource. The rule above does not cover it: RBAC matches a subresource only by its own name
# (or "*"), and without this the helper's scale GET is a 403, which by its contract changes nothing,
# so an opted-in controller would silently never scale. Only get and patch: the helper does nothing
# else to the scale. Asserted by TestControllerClusterRoleGrantsTheScaleToZeroHelper (rbacguard),
# because the calls are made inside provider-runtime and the AST guard cannot see them.
- apiGroups:
  - apps
  resources:
  - deployments/scale
  verbs:
  - get
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  # #270. Undeploy waits for a retiring controller's POD to disappear before deleting the
  # ServiceAccount it runs as (#263), so the SA cannot be revoked out from under an in-flight
  # reconcile. That wait LISTs pods, and this rule was missing when #263 shipped in 2.13.45 --
  # so every CompositionDefinition version bump wedged at Synced=False.
  #
  # The symptom named the wrong layer: the informer swallows the 403 in its retry loop and
  # surfaces "Timeout: failed waiting for *v1.Pod Informer to sync", not "Forbidden".
  #
  # Read-only, and deliberately not widened: the controller never creates, deletes or mutates a
  # pod. The apps/deployments rule above is what manages the retiring Deployment itself.
  - pods
  - serviceaccounts
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - "composition.krateo.io"
  resources:
  - "*"
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - "*"
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
# Migrate a composition-version MutatingAdmissionPolicy still carrying the pre-#66
# ApplyConfiguration mutation onto the JSON Patch form (#173). get+update ONLY, deliberately:
# this chart installs the policy itself, so the controller never needs to create it, and
# withholding `create` makes "core-provider must not mint an unowned policy on the management
# cluster" an RBAC guarantee rather than a convention. An unowned policy here would fail the next
# `helm upgrade` with "invalid ownership metadata" and wedge the umbrella.
# (Remote targets are reached with the target's own credentials, not this ClusterRole; that
# identity does need `create` — see docs/how-to/remote-target-rbac.yaml.)
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingadmissionpolicies
  verbs:
  - get
  - update
# Manage the authn allowlist mapping for compositions that declare an apiRef, so the CDC
# ServiceAccount may exchange its projected token for a service JWT (created in the authn
# operator namespace on deploy, removed on undeploy).
- apiGroups:
  - serviceaccount.authn.krateo.io
  resources:
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
{{- if .Values.leaderElection.enabled }}
# Leader election (on by default, #382): the controller-runtime manager holds a coordination.k8s.io
# Lease so only one replica reconciles at a time, including the old and new pod of a rolling update.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
{{- end }}