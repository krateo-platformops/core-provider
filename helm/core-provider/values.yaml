# Default values for core-provider.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
# Global values. `global.imageRegistry`, when set, replaces the registry HOST of every image in this
# chart (controller, chart-inspector, cdc) — one value relocates all images for a mirror / air-gapped
# install. Repository paths are preserved (matches how registry replication mirrors by default).
global:
  imageRegistry: ""
image:
  registry: ghcr.io
  repository: krateo-platformops/core-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
# OpenTelemetry export for the engine (core-provider) AND every spawned cdc. DEFAULT-OFF: with
# enabled=false the deployments emit no OTEL_* env and are byte-identical (no churn). Flip
# enabled=true to stream metrics+traces to the ClickHouse stack; when endpoint is left "" the chart
# defaults it to the node-local daemonset OTLP agent in the release namespace
# (http://otel-collector-daemonset-opentelemetry-collector.<.Release.Namespace>.svc:4318) — set
# endpoint explicitly to override. The installer only needs enabled=true when observability is on.
# (Logs are always-on structured JSON regardless of this block.)
otel:
  enabled: false
  tracing: true
  endpoint: ""
  protocol: http/protobuf
imagePullSecrets: []
nameOverride: "core-provider"
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# A CPU request is REQUIRED for the CPU-utilization HPA to compute a target (utilization is a
# fraction of the request); with resources:{} the HPA reads <unknown> and never scales.
# Memory: on cold start the engine reconciles EVERY CompositionDefinition at once (fetch chart +
# generate schema/CRD + render), a burst that scales with composition count. On a real umbrella
# (~30 CDs + the multicluster controllers) the cold-start peak measured >1Gi: at 256Mi it OOMKills
# in ~46s, at 1Gi in ~2min — either way it crash-loops. 2Gi survives the cold start (verified).
# CPU: deliberately NO cpu limit. That same cold-start burst is CPU-heavy; a 500m limit throttled
# the engine in ~99.8% of scheduling periods (cgroup cpu.stat nr_throttled≈nr_periods), so it
# pegged at 500m yet made ZERO reconcile progress — versions never advanced, CDCs never rolled,
# despite being otherwise healthy (installer-release). A CPU limit on a bursty reconcile loop is an
# anti-pattern here; the request keeps the HPA valid and the memory limit still bounds the pod. The
# healthy older cluster runs the engine with no limits at all.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 2Gi
# Interim probes: the binary has no /healthz endpoint yet, so we TCP-probe the always-bound metrics
# port (8080). Replace with httpGet /healthz + /readyz once the binary exposes a health endpoint.
#
# Tolerances are explicit because the Kubernetes defaults (timeoutSeconds:1, failureThreshold:3)
# kill HEALTHY pods under CPU contention: a busy-but-alive process misses the 1s probe deadline
# three times and gets restarted, and the restart storm worsens the contention. Liveness is
# lenient (~120s of consecutive failures (periodSeconds 20 × failureThreshold 6) before a restart — only truly dead processes die);
# readiness keeps failureThreshold:3 so a genuinely wedged pod is promptly removed from
# endpoints, but load alone must not flap it (same tolerances as the chart-inspector block below).
livenessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# HA is opt-in: raising replicaCount>=2 REQUIRES leaderElection.enabled=true, or the replicas
# double-reconcile (the binary defaults leader-election off). Enabling it also needs the
# coordination.k8s.io/leases RBAC, which the chart grants when this is on.
leaderElection:
  enabled: false
# PodDisruptionBudget — only rendered when enabled AND replicaCount>1 (a PDB on a single replica
# would block node drains).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Spread replicas across nodes/zones so a single node failure cannot take out all of them. Only
# meaningful at replicaCount>1; rendered when non-empty.
topologySpreadConstraints: []
# core-provider's provider-runtime manager drains in-flight reconciles on SIGTERM (controller-runtime
# GracefulShutdownTimeout, ~30s). Keep the pod grace period above it so the kubelet does not SIGKILL
# mid-drain.
terminationGracePeriodSeconds: 45
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Additional volumes on the output Deployment definition.
volumes: []
# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
env:
  CORE_PROVIDER_DEBUG: "false"
# apiRefRBAC — auto-generate the RBAC that authorizes a CompositionDefinition's apiRef RESTAction
# reads. When enabled, core-provider's pod gets a projected authn-audience token and an authn
# allowlist mapping, and calls snowplow's /rbac (authenticated) to grant the per-composition group
# exactly the reads the RESTAction performs.
#
# Requires the authn serviceaccount login strategy (CRD serviceaccount.authn.krateo.io) to be
# installed; set enabled=false on clusters without it.
apiRefRBAC:
  enabled: true
  # snowplowUrl/authnUrl: leave "" to derive from the release namespace at render time —
  # http://snowplow.<.Release.Namespace>.svc.cluster.local:8081 and authn.<ns>...:8082 (the chart
  # defaults). Set either explicitly to override (e.g. a port-80 exposure).
  snowplowUrl: ""
  authnUrl: ""
  # Namespace where core-provider's authn allowlist mapping is created (where authn watches).
  # "" ⇒ the release namespace.
  authnNamespace: ""
  # Group the issued identity belongs to (nominal — /rbac runs under snowplow's own SA).
  group: "krateo:core-provider"
  tokenAudience: authn
  tokenExpirationSeconds: 3600
chartInspector:
  image:
    registry: ghcr.io
    repository: krateo-platformops/chart-inspector
    pullPolicy: IfNotPresent
    # Tracks the chart appVersion (empty tag → krateo.image defaultTag = .Chart.AppVersion, see
    # templates/chart-inspector/deployment.yaml), so each release ships the matching chart-inspector
    # build; set an explicit tag to pin a known-good build.
    tag: ""
  # chart-inspector is stateless (renders manifests to compute RBAC). Its outage wedges installs on
  # core-provider's ~30s /rbac timeout, so HA is valuable — but the platform ships a SINGLE replica by
  # default to keep the committed footprint small (see FOOTPRINT NOTE); opt into HA where you need it.
  #
  # FOOTPRINT NOTE: this defaults to 1 replica requesting cpu:"1"/memory:512Mi (below), so the default
  # committed footprint is ~1 core / 512Mi. For HA on multi-node production clusters, set
  # chartInspector.replicaCount:>=2 + chartInspector.autoscaling.enabled:true (and autoscaling.minReplicas:>=2).
  replicaCount: 1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  # A real HPA consumes these (chart/templates/chart-inspector/hpa.yaml) WHEN enabled. chart-inspector
  # has CPU requests set, so CPU-utilization autoscaling is valid for it. Disabled by default to hold a
  # fixed single-replica footprint; the deployment then pins replicas to chartInspector.replicaCount.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  # Probe port MUST be 8081 — the chart-inspector server (image 1.0.5) listens on 8081, and the
  # Service already targets 8081. These tcpSocket probes previously pointed at :80 (nothing listens
  # there), so every pod got "connection refused" and was liveness-killed within ~60s; the only
  # survivor was a pre-existing pod that had no liveness probe at all. New replicas died before the
  # HPA could scale, so core-provider's /rbac inspect calls had ~one struggling backend and the CDC
  # rollout stalled (observed on installer-release). The modest timeout/failureThreshold slack also
  # keeps a busy-but-alive inspector up during heavy umbrella renders. Upgrade to httpGet /healthz
  # once the image exposes a health path.
  livenessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  # Rendered only when enabled AND replicaCount>1 (default 2 → a PDB keeps one inspector serving
  # /rbac through a node drain).
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints: []
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  service:
    type: ClusterIP
    # Drives the container port only (the Service template hardcodes 8081). The server listens on
    # 8081, so this MUST be 8081 — at 80 the declared containerPort and the probes mismatched the
    # real listen port.
    port: 8081
  env:
    HOME: /tmp # home should be set to /tmp or any other writable directory to avoid permission issues with helm https://github.com/helm/helm/issues/8038
  # chart-inspector renders the WHOLE umbrella to compute RBAC; core-provider calls it with a
  # ~30s HTTP timeout. On a heavy umbrella (full agent fleet + observability) on a CPU-contended
  # node the render exceeds that timeout ("getting chartinspector: context deadline exceeded"),
  # wedging the install (#56). A guaranteed CPU request keeps the render fast enough; the burst
  # limit covers the heaviest umbrellas. Tune down for tiny single-component installs if needed.
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
cdc:
  image:
    registry: ghcr.io
    repository: krateo-platformops/composition-dynamic-controller
    pullPolicy: IfNotPresent
    # The cdc (composition-dynamic-controller) image tag TRACKS the chart appVersion: leave this
    # empty so the asset's krateo.image defaultTag falls back to .Chart.AppVersion (see
    # assets/cdc/deployment.yaml). Every core-provider release then ships the matching cdc build,
    # and a cdc code fix goes live with the engine bump — no separate literal pin to remember.
    # History: cdc was previously pinned to a known-good literal, decoupled from the engine
    # (krateo-core-provider#57). That decoupling had a sharp edge: a cdc fix built by a release did
    # NOT deploy with it, because the chart kept rendering the old pinned tag. That is exactly how
    # the side-effect-free-Observe fix (#67, which self-heals the external-create wedge) was built
    # into cdc 2.12.3 yet the 2.12.3 chart still deployed cdc 2.12.2. Version-locking closes the gap.
    # To hold cdc back to a specific build (e.g. reverting a regression), set an explicit tag here.
    tag: ""
  replicaCount: 1
  # workers / resyncInterval: OPTIONAL fleet-wide defaults for every CDC's reconcile concurrency and
  # resync interval. Leave unset (the default) for per-Kind opt-in only, via a CompositionDefinition's
  # spec.controller; set here to apply a floor across ALL CDCs (a definition's spec.controller still
  # overrides). Unset ⇒ the arg is omitted and the CDC uses its own built-in default (1 worker / 3m).
  # workers: 4
  # resyncInterval: "10m"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  metrics:
    enabled: false
    #port: 8080
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

  # One Deployment per composition TYPE runs concurrently, so keep the per-controller footprint
  # small. CDC is single-replica by design (per-composition controller, no leader election).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # CDC exposes no port by default (metrics off, pprof localhost-only), so no TCP/HTTP probe is
  # possible without a binary change or enabling metrics. HA here is clean rollover on redeploy
  # (graceful drain), not readiness-gating — probes are intentionally left off BY DESIGN: a
  # liveness kill mid-helm-operation manufactures stale-lock states (see issue #57), so do NOT
  # add a liveness probe here.
  # livenessProbe: {}
  # readinessProbe: {}

  # Graceful drain (unstructured-runtime v1.3.2+): let in-flight reconciles finish on SIGTERM.
  # terminationGracePeriodSeconds MUST exceed the drain window so the kubelet does not SIGKILL
  # mid-drain — 45s gives ~15s slack over the 30s default drain.
  #
  # NOTE: the drain code ships in composition-dynamic-controller >= 1.3.2; the default image below
  # (1.2.1) predates it. Bump cdc.image.tag to a >=1.3.2 build to actually run the drain.
  terminationGracePeriodSeconds: 45
  # Additional volumes on the output Deployment definition.
  volumes: []
  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    HOME: /tmp # home should be set to /tmp or any other writable directory to avoid permission issues with helm https://github.com/helm/helm/issues/8038
    COMPOSITION_CONTROLLER_DEBUG: "false"
    COMPOSITION_CONTROLLER_WORKERS: "10"
    # Graceful-shutdown drain window (composition-dynamic-controller >= 1.3.2). Keep it strictly
    # below terminationGracePeriodSeconds (45s) so the pod finishes draining before SIGKILL.
    COMPOSITION_CONTROLLER_GRACEFUL_SHUTDOWN_TIMEOUT: "30s"
    # Resync interval for every spawned composition-dynamic-controller (default 3m). The
    # installer's self-bootstrap emits each component's Pass-B CR only once its deps are
    # Ready AND its CRD is discoverable; advancement to the next dependency level happens
    # on the cdc's resync (its RESTMapper re-discovers new CRDs on a cache miss). 60s makes
    # the umbrella self-bootstrap fully hands-off in a few minutes instead of ~3m per level.
    COMPOSITION_CONTROLLER_RESYNC_INTERVAL: "60s"
