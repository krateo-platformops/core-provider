apiVersion: v2
name: core-provider-crds
description: Krateo PlatformOps Core Provider CRDs

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Kubernetes >= 1.36, matching core-provider itself. Note this is a PRODUCT-COHERENCE floor, not
# an API requirement of these two CRDs: they use x-kubernetes-validations (GA since 1.29) and
# nothing newer, so they would install on much older clusters.
#
# The floor is here because installing them below 1.36 can only produce the silent failure the
# core-provider chart describes -- a CompositionDefinition CRD that accepts objects which nothing
# will ever label or reconcile. These CRDs have no use without the controller, and the controller
# needs 1.36.
#
# Like the other two this DOES exclude supported clusters -- 1.33, 1.34 and 1.35 are all current
# upstream -- but here the exclusion buys coherence rather than correctness, which is why it is the
# one of the three stated as a choice rather than a requirement.
#
# This is the weakest-grounded of the three. If a split install ever needs the CRDs on a cluster
# being upgraded toward 1.36, this is the line to revisit -- the other two are not.
kubeVersion: ">=1.36.0-0"


# Stamped by the release workflow from the tag, like the other two charts here.
#
# This was a hardcoded 0.36.16 until #157. Because the release republishes every chart on every tag,
# a fixed version meant each release overwrote charts/core-provider-crds:0.36.16 with new content
# and orphaned what was there: 30 pushes, 1 surviving tag, 29 untagged. A consumer pinning 0.36.16
# got whatever the most recent release happened to produce.
#
# The worked example is the Kubernetes floor added in #154: it landed in this chart and shipped to
# 0.36.16, so every existing pin silently acquired `kubeVersion: ">=1.36.0-0"` with no version
# change to signal it. A pin whose meaning changes underneath it is the opposite of a pin.
#
# NOTE this chart now moves with the core-provider tag line rather than its own. That is the point
# -- it makes each release's CRD chart independently addressable and diffable -- but it means any
# consumer pinning 0.36.16 must move to the tag version, because 0.36.16 will no longer be produced.
version: CHART_VERSION


home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - core-provider
  - crd
sources:
  - https://github.com/krateo-platformops/core-provider/tree/APP_VERSION
