apiVersion: v2
name: core-provider-target
description: >
  Prerequisites for using a cluster as a Krateo core-provider remote deployment target:
  the composition-version MutatingAdmissionPolicy. Install into every cluster referenced
  by a KubernetesTarget. Requires Kubernetes >= 1.36.
type: application

# Kubernetes >= 1.36 is a hard requirement on the TARGET cluster. This chart also ships
# templates/compositions-version-policy.yaml (MutatingAdmissionPolicy, admissionregistration.k8s.io/v1),
# which is the GA shape and does not exist before 1.36.
#
# This is the most valuable of the three floors and the least obvious. This chart is what projects
# the policy into a REMOTE target, and a target cluster below 1.36 cannot serve
# MutatingAdmissionPolicy at all -- so it installing "successfully" there is exactly the silent
# failure. The target is also the cluster nobody checks the version of, because it is not the
# management cluster where core-provider runs.
#
# This floor DOES exclude supported clusters, deliberately. 1.33, 1.34 and 1.35 are all current
# upstream and can no longer be used as a target. On them this chart's policy cannot be served, so
# nothing stamps krateo.io/composition-version on the target's compositions, and the
# composition-dynamic-controller's exact-equality selector
# (composition-dynamic-controller/main.go:329) matches none of them. The bootstrap reports success
# and the target reconciles nothing. A refused install is the better failure.
kubeVersion: ">=1.36.0-0"


# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: CHART_VERSION

home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - core-provider
  - target
sources:
  - https://github.com/krateo-platformops/core-provider/tree/SOURCE_REF
